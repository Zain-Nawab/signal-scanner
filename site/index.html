<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Scanner</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e6e9ef;--mut:#8b93a1;--up:#26a69a;--dn:#ef5350;--ac:#5b8def}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
h1{font-size:17px;margin:0}main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.banner{background:#3a2e12;color:#f0c36b;padding:8px 12px;border-radius:8px;display:none}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.on{background:var(--up)}
.long{color:var(--up)}.short{color:var(--dn)}.sig{border-left:3px solid var(--ac);margin-bottom:10px;padding:10px 12px;background:#12161c;border-radius:6px}
.sig.l{border-color:var(--up)}.sig.s{border-color:var(--dn)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.grid small{display:block;color:var(--mut)}button{background:var(--ac);border:0;color:#fff;padding:7px 12px;border-radius:7px;cursor:pointer}
#chart{height:340px}.wrap{overflow-x:auto}select{background:#12161c;color:var(--tx);border:1px solid var(--line);padding:6px;border-radius:6px}
li{margin:2px 0;color:var(--mut)}ul{margin:6px 0 0;padding-left:18px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>Trade Scanner <span id="meta" style="color:var(--mut);font-weight:400"></span></h1>
<span id="src" style="color:var(--mut)"></span></header>
<main>
<div class="banner" id="demo"></div>
<div class="card"><h2>Watchlist (needs ≥ <span id="minc">3</span> of 4 confirmations + higher-timeframe trend)</h2>
<div class="wrap"><table id="watch"></table></div></div>
<div class="card"><h2>Signals</h2><div id="sigs"><span style="color:var(--mut)">No signals yet. Weak setups are filtered out, so quiet periods are normal.</span></div></div>
<div class="card"><h2>Chart <select id="sym" onchange="loadChart()"></select></h2><div id="chart"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let chart,series,lines=[];
async function j(u,o){return (await fetch(u,o)).json()}
const cats=["structure","vsa","price","momentum"];
async function refresh(){
 const st=await j("status.json?t="+Date.now());$("minc").textContent=st.min_confirmations;
 $("meta").textContent=` ${st.timeframe} / HTF ${st.htf} · last scan ${st.last_scan?new Date(st.last_scan).toLocaleTimeString():"pending"}`;
 const age=(Date.now()-new Date(st.last_scan))/60000,errs=Object.entries(st.errors||{});
 $("src").textContent=st.source?"data: "+st.source:"";
 $("demo").style.display=(age>40||errs.length)?"block":"none";
 $("demo").innerHTML=(age>40?`Last scan was ${Math.round(age)} min ago: the scheduler may be delayed or stopped. `:"")+errs.map(([k,v])=>`${k}: ${typeof v==="string"?v:JSON.stringify(v)}`).join(" · ");
 if(!$("sym").options.length){st.symbols.forEach(s=>$("sym").add(new Option(s,s)));loadChart()}
 let h="<tr><th>Symbol</th><th>Price</th><th>1H trend</th><th>Side</th>"+cats.map(c=>`<th>${c}</th>`).join("")+"<th>Score</th></tr>";
 for(const [s,w] of Object.entries(st.watch)){
  const t=w.htf_trend; const tt=t>0?'<span class=long>Up</span>':t<0?'<span class=short>Down</span>':"Flat";
  const side=t<0?"short":"long"; const x=w[side]||{cats:{},score:0};
  h+=`<tr><td><b>${s}</b></td><td>${(+w.price).toLocaleString()}</td><td>${tt}</td><td class=${side}>${side}</td>`+
     cats.map(c=>`<td><span class="dot ${x.cats[c]?"on":""}"></span></td>`).join("")+`<td>${x.score}/4</td></tr>`}
 $("watch").innerHTML=h;
 const sg=await j("signals.json?t="+Date.now());
 if(sg.length)$("sigs").innerHTML=sg.map(s=>`<div class="sig ${s.side[0]}"><b class=${s.side}>${s.side.toUpperCase()}</b> ${s.symbol}
  · Grade ${s.grade} (${s.score}/4) · <span style="color:var(--mut)">${new Date(s.created).toLocaleString()} · via ${s.delivered_via||"-"}</span>
  <div class=grid><div><small>Entry</small>${s.entry}</div><div><small>Stop</small>${s.stop}</div><div><small>TP1 (2R)</small>${s.tp1}</div><div><small>TP2 (3R)</small>${s.tp2}</div></div>
  <ul><li>${s.reasons}</li></ul></div>`).join("");
 window._sigs=sg;drawLevels();
}
async function loadChart(){
 if(typeof LightweightCharts==='undefined'){$('chart').innerHTML='<span style="color:var(--mut)">Chart library could not load.</span>';return}
 if(!chart){chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#171b22"},textColor:"#8b93a1"},grid:{vertLines:{color:"#262c36"},horzLines:{color:"#262c36"}},timeScale:{timeVisible:true}});
  series=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
  new ResizeObserver(()=>chart.applyOptions({width:$("chart").clientWidth})).observe($("chart"))}
 window._c=window._c||await j("candles.json?t="+Date.now());series.setData(window._c[$("sym").value]||[]);chart.timeScale().fitContent();drawLevels()}
function drawLevels(){if(!series)return;lines.forEach(l=>series.removePriceLine(l));lines=[];
 const s=(window._sigs||[]).find(x=>x.symbol==$("sym").value);if(!s)return;
 [["Entry",s.entry,"#5b8def"],["SL",s.stop,"#ef5350"],["TP1",s.tp1,"#26a69a"],["TP2",s.tp2,"#26a69a"]].forEach(([t,p,c])=>lines.push(series.createPriceLine({price:p,color:c,title:t,lineWidth:1})))}
refresh();setInterval(()=>{window._c=null;refresh();loadChart()},120000);
</script></body></html>
