name: check-sources

# Phase 0: finds out which exchange endpoints GitHub's servers can reach.
# Result is written to the `check` branch (check.json).
on:
  workflow_dispatch:
  push:
    paths:
      - check_sources.py
      - data.py
      - .github/workflows/check-sources.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check sources
        env:
          STATE_DIR: check_out
        run: python check_sources.py
      - name: Publish result to check branch
        run: |
          cd check_out
          git init -q -b check
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "check $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" check
