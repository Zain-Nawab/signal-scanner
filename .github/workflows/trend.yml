name: trend

# Daily trend-following research (18 coins, ~6 years). Result goes to the `trend` branch.
on:
  workflow_dispatch:
  push:
    paths:
      - trend_lab.py
      - lab.py
      - .github/workflows/trend.yml

permissions:
  contents: write

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p out
          python trend_lab.py --days 2300 --out out/trend
      - name: Publish to trend branch
        run: |
          cd out
          git init -q -b trend
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "trend $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" trend
