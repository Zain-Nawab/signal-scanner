name: lab

# Strategy research: 3 years, 10 coins, 3 timeframes. Results go to the `lab` branch.
on:
  workflow_dispatch:
  push:
    paths:
      - lab.py
      - analyze.py
      - backtest.py
      - engine.py
      - indicators.py
      - .github/workflows/lab.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT, AVAXUSDT, LTCUSDT]
        tf: ["15m:1h", "1h:4h", "4h:1d"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lab ${{ matrix.symbol }} ${{ matrix.tf }}
        run: |
          TF=${{ matrix.tf }}
          python lab.py ${{ matrix.symbol }} --tf ${TF%%:*} --htf ${TF##*:} --days 1100 --out lab_results
      - uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.symbol }}-${{ strategy.job-index }}
          path: lab_results/*.json

  report:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: lab-*
          path: lab_results
          merge-multiple: true
      - run: |
          ls lab_results | wc -l
          mkdir -p out
          python analyze.py lab_results --out out/analysis
      - name: Publish to lab branch
        run: |
          cd out
          git init -q -b lab
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "lab $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lab
