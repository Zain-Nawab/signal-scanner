name: scan

on:
  schedule:
    - cron: "1,16,31,46 * * * *"     # just after each 15m candle closes (UTC)
  workflow_dispatch:
    inputs:
      test_signal:
        description: "Send ONE fake test signal through Make/Telegram (no real scan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore state from data branch
        run: |
          # Never start from empty state when a saved state exists (that would resend old signals).
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          set +e
          git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1
          RC=$?
          set -e
          if [ "$RC" = "2" ]; then
            echo "no data branch yet (first run)"; mkdir -p data
          elif [ "$RC" = "0" ]; then
            for n in 1 2 3; do
              rm -rf data
              git clone -q --depth 1 --branch data "$URL" data && break
              sleep 5
            done
            test -f data/status.json || { echo "state could not be restored; refusing to run"; exit 1; }
          else
            echo "cannot reach GitHub (rc=$RC); refusing to run"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          STATE_DIR: data
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p data
          if [ "${{ inputs.test_signal }}" = "true" ]; then
            python run_scan.py --test-signal
          else
            python run_scan.py
          fi

      - name: Publish state + dashboard to data branch
        run: |
          mkdir -p data
          cp site/index.html data/index.html
          touch data/.nojekyll
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "scan $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
