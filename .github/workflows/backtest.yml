name: backtest

# Runs the walk-forward backtest on ~12 months of real data, one job per coin,
# then publishes report.md / report.json to the `backtest` branch.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "365"
  push:
    paths:
      - backtest.py
      - report.py
      - engine.py
      - indicators.py
      - .github/workflows/backtest.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest ${{ matrix.symbol }}
        run: python backtest.py ${{ matrix.symbol }} --days ${{ inputs.days || 365 }} --out results
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.symbol }}
          path: results/*.json

  report:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: results
          merge-multiple: true
      - name: Build report
        run: |
          mkdir -p out
          python report.py results --out out/report
          cp results/*.json out/
      - name: Publish to backtest branch
        run: |
          cd out
          git init -q -b backtest
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "backtest $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" backtest
